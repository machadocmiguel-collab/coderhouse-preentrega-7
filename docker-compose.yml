services:
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6387:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  phoenix:
    image: arizephoenix/phoenix:version-21.0.0
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_DISABLE_MODEL_COST_AUTO_UPDATE: "true"
    ports:
      - "127.0.0.1:6007:6006"
    volumes:
      - phoenix-data:/data
  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: pre7
      API_TOKEN: ${API_TOKEN:-local-demo}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:latest
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: preentrega7-carga5-final
      WORKERS: "1"
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
volumes:
  redis-data:
  phoenix-data:
